name: macOS

# Builds 86Box, the session layer, the FujiNet runtime, the full test suite
# and the AppKit frontend on both Mac architectures.
#
# This is the ONLY place macOS is compiled: none of frontends/macos was
# written on a Mac. A failure here is real signal about that code.
#
# Two legs, one per architecture: macos-latest is Apple Silicon (arm64,
# where 86Box's recompiler needs MAP_JIT); the Intel leg is macos-15-intel.
# Each leg checks the runner really is the architecture it claims.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      DYLD_LIBRARY_PATH: /tmp/sdl3-install/lib
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and 86Box's libraries
        run: brew install cmake ninja python3 pkgconf freetype libpng libsndfile zstd

      - name: Confirm the runner's architecture matches the matrix leg
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" \
            || { echo "::error::runner is $(uname -m), expected ${{ matrix.arch }}"; exit 1; }

      - name: Build and install SDL3 (release-3.4.12, pinned)
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      # RelWithDebInfo rather than the default Release: same optimisation
      # class, but a crash on a runner we cannot sit at gets line numbers.
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-install

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -LE network

      - name: Linked libraries
        run: |
          app="build/frontends/macos/FujiNet Go MS-DOS.app/Contents/MacOS"
          otool -L "$app/FujiNet Go MS-DOS"
          ls -la "$app"

      # The app on the runner's display, kept as an artifact (the only look
      # at the AppKit frontend anyone gets without a Mac). With no BIOS it
      # shows the import page.
      - name: Screenshot
        continue-on-error: true
        run: |
          app="build/frontends/macos/FujiNet Go MS-DOS.app/Contents/MacOS/FujiNet Go MS-DOS"
          MSDOS_SCREENSHOT="$PWD/macos-${{ matrix.arch }}.png" MSDOS_SCREENSHOT_FRAMES=300 \
            MSDOS_AUTOQUIT_FRAMES=360 "$app" &
          pid=$!
          for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la macos-*.png

      # The Help window, at a section and with a search's highlights.
      - name: Help screenshots
        continue-on-error: true
        run: |
          app="build/frontends/macos/FujiNet Go MS-DOS.app/Contents/MacOS/FujiNet Go MS-DOS"
          for shot in "breakpoints:debugger/breakpoints" "search:?write-protect floppy"; do
            MSDOS_OPEN_HELP="${shot#*:}" MSDOS_HELP_SCREENSHOT="$PWD/macos-${{ matrix.arch }}-help-${shot%%:*}.png" \
              MSDOS_SCREENSHOT_FRAMES=300 MSDOS_AUTOQUIT_FRAMES=360 "$app" &
            pid=$!
            for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null || true
          done
          ls -la macos-*.png

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-screenshot
          path: macos-*.png
          if-no-files-found: ignore

      - name: Backtraces for failed tests
        if: failure()
        working-directory: build
        run: |
          xcodebuild -version | head -1; uname -a
          for t in $(ctest -N | sed -n 's/^ *Test *#[0-9]*: *//p'); do
            exe=$(ctest -V -R "^$t$" -N 2>/dev/null | sed -n 's/^[0-9]*: Test command: *//p' | head -1 | tr -d '"')
            [ -x "$exe" ] || continue
            echo "=== $t ($exe) ==="
            lldb --batch \
              -o "settings set target.env-vars DYLD_LIBRARY_PATH=/tmp/sdl3-install/lib" \
              -o "run" -o "bt all" -o "register read" -o "quit" -- "$exe" 2>&1 | tail -120 || true
          done
