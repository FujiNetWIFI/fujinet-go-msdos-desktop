name: Windows

# Native MSYS2/UCRT64: 86Box, the session layer, the FujiNet runtime, the
# test suite and the Win32 frontend. 86Box's own Windows platform code
# (win_netsocket.c, win_dynld.c) serves the embedded core; the core's
# threads are winpthreads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-gdb

      - name: Confirm the packaged SDL3 is on the 3.x line
        run: pacman -Q mingw-w64-ucrt-x86_64-sdl3 | grep -qE ' 3\.[0-9]+\.[0-9]+-'

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -LE network

      # A crash on a runner we cannot sit at is only diagnosable with a
      # backtrace: re-run every failing test under gdb and print it.
      - name: Backtraces for failed tests
        if: failure()
        working-directory: build
        run: |
          for t in $(sed -n 's/^\([0-9]*\):\(.*\)$/\2/p' Testing/Temporary/LastTestsFailed.log 2>/dev/null); do
            exe=$(ctest -V -R "^$t$" -N 2>/dev/null | sed -n 's/^[0-9]*: Test command: *//p' | head -1 | tr -d '"')
            [ -n "$exe" ] || continue
            echo "=== $t ($exe) under gdb ==="
            # _NO_DEBUG_HEAP: a process started under a debugger otherwise
            # gets Windows' debug heap, which hides heap misuse
            _NO_DEBUG_HEAP=1 timeout 300 gdb -q -batch -ex "set pagination off" -ex run \
              -ex "thread apply all bt 30" -ex "info registers" --args "$exe" 2>&1 | tail -200 || true
          done
